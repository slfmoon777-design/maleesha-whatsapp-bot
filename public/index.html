
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maleesha Bandara | WhatsApp Bot Platform</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            background:
                radial-gradient(circle at top left, #4c1d95, transparent 40%),
                linear-gradient(135deg, #05020c, #16052b);
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 70px 20px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px;
        }

        .hero h1 {
            font-size: 42px;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #00e5ff;
        }

        .hero p {
            color: #c4b5fd;
            font-size: 18px;
            margin-bottom: 30px;
        }

        .get-started {
            display: inline-block;
            padding: 15px 35px;
            border-radius: 10px;
            background: linear-gradient(135deg, #7c3aed, #c026d3);
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .contact {
            margin-top: 40px;
            padding: 45px 20px;
            text-align: center;
            border-radius: 20px;
            background: rgba(30, 15, 60, 0.95);
            border: 1px solid #6335a8;
        }

        .contact h2 {
            color: #00e5ff;
            font-size: 30px;
            margin-bottom: 15px;
        }

        .contact p {
            color: #c4b5fd;
            margin-bottom: 30px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .social-buttons a {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 8px;
            background: #7c3aed;
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .social-buttons a:hover {
            background: #a855f7;
            transform: translateY(-3px);
        }

        .email {
            margin-top: 30px;
            color: white;
        }

        .email a {
            color: #00e5ff;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #a78bfa;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- HOME SECTION -->

        <section class="hero">

            <h1>
                🤖 Maleesha <span>Bandara</span>
                WhatsApp Bot Platform
            </h1>

            <p>
                Create and manage your WhatsApp bots easily.
            </p>

            <a class="get-started" href="dashboard.html">
                Get Started
            </a>

        </section>


        <!-- CONTACT SECTION -->

        <section class="contact" id="contact">

            <h2>Contact & Social Media</h2>

            <p>
                Connect with Maleesha Bandara
            </p>

            <div class="social-buttons">

                <a href="https://instagram.com/"
                   target="_blank">
                    Instagram
                </a>

                <a href="https://facebook.com/"
                   target="_blank">
                    Facebook
                </a>

                <a href="https://tiktok.com/"
                   target="_blank">
                    TikTok
                </a>

                <a href="https://youtube.com/"
                   target="_blank">
                    YouTube
                </a>

            </div>

            <div class="email">
                Email:
                <a href="mailto:your-email@example.com">
                    your-email@example.com
                </a>
            </div>

        </section>

    </div>


    <!-- FOOTER -->

    <footer>
        © 2026 Maleesha Bandara. All Rights Reserved.
    </footer>

</body>

</html>
