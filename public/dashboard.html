
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maleesha Bandara | Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #ff1744;
            --light-red: #ff718c;
            --dark-red: #8f001f;
            --bg: #050505;
            --card: rgba(25, 7, 12, .82);
            --border: rgba(255, 23, 68, .35);
            --text: #fff;
            --muted: #bca8ae;
        }

        body {
            font-family: Poppins, sans-serif;
            color: var(--text);
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 10%, #60001955, transparent 35%),
                radial-gradient(circle at 90% 90%, #ff003322, transparent 35%),
                #050505;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            opacity: .15;
            background-image:
                linear-gradient(#ff174415 1px, transparent 1px),
                linear-gradient(90deg, #ff174415 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        body::after {
            content: "";
            position: fixed;
            width: 400px;
            height: 400px;
            top: -150px;
            left: -150px;
            z-index: -1;
            border-radius: 50%;
            background: #ff174433;
            filter: blur(100px);
            animation: glowMove 12s ease-in-out infinite alternate;
        }

        @keyframes gridMove {
            from { transform: translateY(0); }
            to { transform: translateY(50px); }
        }

        @keyframes glowMove {
            to { transform: translate(100vw, 70vh); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 6%;
            background: #080808dd;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }

        .logo {
            font-family: Orbitron, sans-serif;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px var(--red);
        }

        .logo span {
            color: var(--red);
        }

        .user-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #username {
            color: var(--light-red);
            font-size: 13px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            transition: .3s;
        }

        .logout-btn {
            padding: 9px 18px;
            color: white;
            background: #ff174415;
            border: 1px solid var(--red);
            border-radius: 9px;
        }

        .logout-btn:hover {
            background: var(--red);
            box-shadow: 0 0 22px #ff174499;
        }

        main {
            width: min(1200px, 90%);
            margin: auto;
            padding: 45px 0;
        }

        .hero {
            margin-bottom: 38px;
            animation: fadeUp .8s ease;
        }

        .eyebrow {
            color: var(--red);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 4px;
            margin-bottom: 13px;
        }

        h1 {
            font-family: Orbitron, sans-serif;
            font-size: clamp(26px, 5vw, 48px);
            line-height: 1.35;
            background: linear-gradient(90deg, white, #ff5475, white);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textGlow 5s linear infinite;
        }

        @keyframes textGlow {
            to { background-position: 200% center; }
        }

        .hero p {
            color: var(--muted);
            font-size: 14px;
            margin-top: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 35px #0008;
            transition: .3s;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--red);
            box-shadow: 0 0 25px #ff174433;
        }

        .stat-card {
            padding: 25px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 12px;
        }

        .stat-value {
            font-family: Orbitron, sans-serif;
            font-size: 25px;
            font-weight: 700;
        }

        .stat-value span {
            color: var(--red);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: Orbitron, sans-serif;
            font-size: 17px;
            margin-bottom: 18px;
        }

        .section-title::before {
            content: "";
            width: 4px;
            height: 22px;
            border-radius: 5px;
            background: var(--red);
            box-shadow: 0 0 15px var(--red);
        }

        .create-card {
            padding: 26px;
            margin-bottom: 30px;
        }

        .create-row {
            display: flex;
            gap: 12px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            color: white;
            background: #050505aa;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            font-family: inherit;
        }

        input:focus {
            border-color: var(--red);
            box-shadow: 0 0 15px #ff174433;
        }

        input::placeholder {
            color: #806b72;
        }

        .primary-btn {
            padding: 13px 24px;
            white-space: nowrap;
            color: white;
            font-weight: 600;
            background: linear-gradient(135deg, var(--dark-red), var(--red));
            border: 1px solid var(--red);
            border-radius: 10px;
            box-shadow: 0 0 15px #ff174433;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px #ff174499;
        }

        .bots-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .bot-card {
            padding: 24px;
            animation: fadeUp .6s ease both;
        }

        .bot-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
        }

        .bot-icon {
            width: 52px;
            height: 52px;
            display: grid;
            place-items: center;
            font-size: 25px;
            border-radius: 15px;
            background: #ff174415;
            border: 1px solid var(--border);
            box-shadow: 0 0 20px #ff174422;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #ff8da3;
            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 10px var(--red);
        }

        .bot-name {
            font-family: Orbitron, sans-serif;
            font-size: 16px;
            margin-bottom: 9px;
            overflow-wrap: anywhere;
        }

        .bot-date {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 22px;
        }

        .bot-actions {
            display: flex;
            gap: 10px;
        }

        .manage-btn,
        .delete-btn {
            flex: 1;
            padding: 11px;
            border-radius: 9px;
            font-size: 12px;
            font-weight: 600;
        }

        .manage-btn {
            color: white;
            background: #ff174422;
            border: 1px solid var(--red);
        }

        .manage-btn:hover {
            background: var(--red);
            box-shadow: 0 0 20px #ff174477;
        }

        .delete-btn {
            color: #ff8da3;
            background: #ff17440d;
            border: 1px solid #ff174455;
        }

        .delete-btn:hover {
            background: #8f001f;
            color: white;
        }

        .empty,
        .loading {
            grid-column: 1 / -1;
            padding: 50px 20px;
            text-align: center;
            color: var(--muted);
            border: 1px dashed var(--border);
            border-radius: 18px;
        }

        .empty-icon {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            margin: 0 auto 15px;
            border: 3px solid #ff174433;
            border-top-color: var(--red);
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            right: 25px;
            bottom: 25px;
            max-width: 320px;
            padding: 15px 20px;
            color: white;
            background: #25070e;
            border: 1px solid var(--red);
            border-radius: 12px;
            box-shadow: 0 0 25px #ff174455;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: .3s;
            z-index: 20;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media (max-width: 700px) {
            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 13px;
            }

            #username {
                display: none;
            }

            main {
                width: 90%;
                padding: 30px 0;
            }

            .stats,
            .bots-grid {
                grid-template-columns: 1fr;
            }

            .create-row {
                flex-direction: column;
            }

            .primary-btn {
                width: 100%;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">
            MALEESHA <span>BANDARA</span>
        </div>

        <div class="user-area">
            <span id="username">Loading...</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <main>

        <section class="hero">
            <div class="eyebrow">CONTROL CENTER // 01</div>

            <h1>
                Welcome to your<br>
                Bot Command Center
            </h1>

            <p>
                Create, manage and configure your WhatsApp automation bots.
            </p>
        </section>

        <section class="stats">

            <div class="card stat-card">
                <div class="stat-label">TOTAL BOTS</div>
                <div class="stat-value" id="totalBots">0</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">ACTIVE BOTS</div>
                <div class="stat-value" id="activeBots">0</div>
            </div>

            <div class="card stat-card">
                <div class="stat-label">PLATFORM API</div>
                <div class="stat-value">
                    <span>●</span> ONLINE
                </div>
            </div>

        </section>

        <section class="card create-card">

            <div class="section-title">Create New Bot</div>

            <div class="create-row">

                <input
                    type="text"
                    id="botName"
                    placeholder="Enter your bot name..."
                    maxlength="80"
                >

                <button class="primary-btn" onclick="createBot()">
                    + Create Bot
                </button>

            </div>

        </section>

        <section>

            <div class="section-title">Your Bots</div>

            <div class="bots-grid" id="botsList">

                <div class="loading">
                    <div class="spinner"></div>
                    Loading your bots...
                </div>

            </div>

        </section>

    </main>

    <div class="toast" id="toast"></div>

    <script>

        function showToast(message) {
            const toast = document.getElementById("toast");

            toast.textContent = message;
            toast.classList.add("show");

            setTimeout(() => {
                toast.classList.remove("show");
            }, 3000);
        }

        async function checkLogin() {

            try {
                const response = await fetch("/api/me", {
                    credentials: "include"
                });

                if (!response.ok) {
                    window.location.href = "login.html";
                    return false;
                }

                const data = await response.json();

                if (data.user) {
                    document.getElementById("username").textContent =
                        data.user.username || "User";
                }

                return true;

            } catch (error) {
                console.error(error);
                window.location.href = "login.html";
                return false;
            }
        }

        async function loadBots() {

            const list = document.getElementById("botsList");

            list.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    Loading your bots...
                </div>
            `;

            try {

                const response = await fetch("/api/bots", {
                    credentials: "include"
                });

                if (response.status === 401) {
                    window.location.href = "login.html";
                    return;
                }

                if (!response.ok) {
                    throw new Error("Failed to load bots");
                }

                const bots = await response.json();

                document.getElementById("totalBots").textContent =
                    bots.length;

                document.getElementById("activeBots").textContent =
                    bots.filter(bot => bot.autoReply === true).length;

                if (!bots.length) {

                    list.innerHTML = `
                        <div class="empty">
                            <div class="empty-icon">🤖</div>
                            <p>No bots created yet.</p>
                            <small>Create your first bot above.</small>
                        </div>
                    `;

                    return;
                }

                list.innerHTML = "";

                bots.forEach((bot, index) => {

                    const card = document.createElement("div");
                    card.className = "card bot-card";
                    card.style.animationDelay = index * .08 + "s";

                    const createdDate = bot.createdAt
                        ? new Date(bot.createdAt).toLocaleDateString()
                        : "Unknown";

                    const active = bot.autoReply === true;

                    card.innerHTML = `
                        <div class="bot-top">

                            <div class="bot-icon">🤖</div>

                            <div class="status">
                                <span class="status-dot"
                                    style="${active
                                        ? ""
                                        : "background:#6d555c;box-shadow:none;"
                                    }">
                                </span>
                                ${active ? "ACTIVE" : "IDLE"}
                            </div>

                        </div>

                        <div class="bot-name"></div>

                        <div class="bot-date">
                            Created: ${createdDate}
                        </div>

                        <div class="bot-actions">
                            <button class="manage-btn">Manage</button>
                            <button class="delete-btn">Delete</button>
                        </div>
                    `;

                    card.querySelector(".bot-name").textContent =
                        bot.name || "Unnamed Bot";

                    card.querySelector(".manage-btn")
                        .addEventListener("click", () => {
                            manageBot(bot._id);
                        });

                    card.querySelector(".delete-btn")
                        .addEventListener("click", () => {
                            deleteBot(bot._id);
                        });

                    list.appendChild(card);
                });

            } catch (error) {

                console.error(error);

                list.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">⚠️</div>
                        <p>Failed to load bots.</p>
                        <small>Please try again.</small>
                    </div>
                `;
            }
        }

        async function createBot() {

            const input = document.getElementById("botName");
            const name = input.value.trim();

            if (!name) {
                showToast("Please enter a bot name.");
                return;
            }

            try {

                const response = await fetch("/api/bots", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "include",
                    body: JSON.stringify({ name })
                });

                if (response.status === 401) {
                    window.location.href = "login.html";
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    showToast(data.error || "Failed to create bot.");
                    return;
                }

                input.value = "";
                showToast("Bot created successfully! 🚀");

                await loadBots();

            } catch (error) {
                console.error(error);
                showToast("Server connection failed.");
            }
        }

        function manageBot(id) {
            window.location.href =
                "bot.html?id=" + encodeURIComponent(id);
        }

        async function deleteBot(id) {

            if (!confirm("Are you sure you want to delete this bot?")) {
                return;
            }

            try {

                const response = await fetch(
                    "/api/bots/" + encodeURIComponent(id),
                    {
                        method: "DELETE",
                        credentials: "include"
                    }
                );

                if (response.status === 401) {
                    window.location.href = "login.html";
                    return;
                }

                const data = await response.json();

                if (!response.ok) {
                    showToast(data.error || "Delete failed.");
                    return;
                }

                showToast("Bot deleted successfully.");
                await loadBots();

            } catch (error) {
                console.error(error);
                showToast("Server connection failed.");
            }
        }

        async function logout() {

            try {
                await fetch("/api/logout", {
                    method: "POST",
                    credentials: "include"
                });
            } catch (error) {
                console.error(error);
            }

            window.location.href = "login.html";
        }

        document.getElementById("botName")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    createBot();
                }
            });

        async function initializeDashboard() {

            const loggedIn = await checkLogin();

            if (loggedIn) {
                await loadBots();
            }
        }

        initializeDashboard();

    </script>

</body>
</html>
